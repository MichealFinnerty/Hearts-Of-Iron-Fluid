<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magma Europe</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--ink:#e8eaee;--mut:#8b95a5;--line:#2a313c}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,sans-serif;overflow:hidden}
#bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
#bar h1{font-size:15px;margin:0 10px 0 0;letter-spacing:.14em;font-weight:700}
button{background:#222a35;color:var(--ink);border:1px solid #364050;border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
button:hover{background:#2d3745}button.on{background:#3a4a63;border-color:#6b86b3}button:focus-visible{outline:2px solid #8fb4ff;outline-offset:1px}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}#stats{margin-left:auto;color:var(--mut);font-variant-numeric:tabular-nums}
canvas{display:block;cursor:grab}canvas.drag{cursor:grabbing}
#tip{position:fixed;pointer-events:none;background:rgba(13,17,23,.94);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;display:none;white-space:nowrap}
#info,#legend{position:fixed;background:rgba(22,27,34,.93);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12px}
#info{left:10px;bottom:10px;min-width:200px;display:none}#info b{font-size:13px}
#legend{right:10px;bottom:10px;max-height:46vh;overflow:auto}#legend div{display:flex;align-items:center;gap:6px;margin:2px 0}#legend i{width:12px;height:12px;border-radius:3px;border:1px solid rgba(255,255,255,.25)}
#credit{position:fixed;left:10px;top:52px;color:rgba(255,255,255,.45);font-size:11px;pointer-events:none}
</style></head><body>
<div id="bar"><h1>MAGMA EUROPE · 1941</h1>
<button data-m="0" class="on">Political</button><button data-m="1">Terrain</button><button data-m="2">States</button><button data-m="3">Provinces</button><span class="sep"></span>
<button id="lab" class="on">Labels</button><button id="riv" class="on">Rivers</button><span class="sep"></span>
<button id="zo" title="Zoom out">−</button><button id="zi" title="Zoom in">+</button><button id="zf">Fit</button><span id="stats"></span></div>
<canvas id="c"></canvas><div id="tip"></div><div id="info"></div><div id="legend"></div>
<div id="credit">Wheel zooms, drag pans, click selects a province. Geography: Natural Earth (public domain). Provinces are generated, not taken from HOI4.</div>
<script src="map-data.js"></script>
<script>
(()=>{
const $=i=>document.getElementById(i);
if(!window.MAP){document.body.innerHTML='<p style="padding:20px">map-data.js is missing. Put it next to index.html.</p>';return}
const M=window.MAP,Q=M.q,LW=M.ext[0],LN=M.ext[3],WW=M.ext[2]-LW,HH=LN-M.ext[1];
const cv=$('c'),ctx=cv.getContext('2d');
let dpr=1,CW=0,CH=0,Z=18,ox=0,oy=0,dirty=true,mi=0,showLab=true,showRiv=true,hover=-1,sel=-1,drag=null,px=1,zmin=10;
const wx=lon=>lon-LW,wy=lat=>LN-lat;
function ringPath(p,a){let x=a[0],y=a[1];p.moveTo(x*Q,y*Q);for(let i=2;i<a.length;i+=2){x+=a[i];y+=a[i+1];p.lineTo(x*Q,y*Q)}p.closePath()}
function linePath(p,a){let x=a[0],y=a[1];p.moveTo(x*Q,y*Q);for(let i=2;i<a.length;i+=2){x+=a[i];y+=a[i+1];p.lineTo(x*Q,y*Q)}}
const build=(l,f)=>{const p=new Path2D();for(const a of l)f(p,a);return p};
const landP=build(M.land,ringPath),coastP=build(M.coast,linePath),stP=build(M.stateLines,linePath),coP=build(M.countryLines,linePath),lakeP=build(M.lakes,ringPath),rivP=build(M.rivers,linePath);
const RGB=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16)),GC=M.groups.map(g=>RGB(g.c));
const TN=['Plains','Forest','Hills','Mountains','Marsh','Urban'],TC=['#bdb68a','#6f9158','#b3995a','#8a8076','#6c9c92','#a7a29a'].map(RGB),TF=[1,.9,.95,.8,.92,1.08];
const mix=(a,b,t)=>a.map((v,k)=>v+(b[k]-v)*t),rgb=a=>'rgb('+a.map(v=>Math.max(0,Math.min(255,v|0))).join()+')',hh=(i,s)=>((i*2654435761+s*40503)>>>0)%1000/1000;
const P=M.prov.map((r,i)=>{const path=new Path2D();let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
 for(const a of r[5]){let x=a[0],y=a[1];path.moveTo(x*Q,y*Q);for(let k=2;k<=a.length;k+=2){if(k<a.length){x+=a[k];y+=a[k+1];path.lineTo(x*Q,y*Q)}const X=x*Q,Y=y*Q;if(X<x0)x0=X;if(X>x1)x1=X;if(Y<y0)y0=Y;if(Y>y1)y1=Y}path.closePath()}
 const t=r[1],j=.94+.12*hh(i,1),tc=TC[t];
 return{i,g:r[0],t,s:r[2],cx:wx(r[3]),cy:wy(r[4]),path,x0,y0,x1,y1,
  f:[rgb(mix(GC[r[0]],tc,.2).map(v=>v*TF[t]*j)),rgb(tc.map(v=>v*(.93+.14*hh(i,2)))),'hsl('+(r[2]*137.5%360)+',42%,'+(48+8*hh(r[2],3))+'%)','hsl('+(i*47%360)+',38%,'+(50+10*hh(i,4))+'%)']}});
const nbr=P.map(()=>[]);for(let k=0;k<M.adj.length;k+=2){nbr[M.adj[k]].push(M.adj[k+1]);nbr[M.adj[k+1]].push(M.adj[k])}
const stCount={};for(const p of P)stCount[p.s]=(stCount[p.s]||0)+1;
const noise=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),d=g.createImageData(128,128);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}g.putImageData(d,0,0);return ctx.createPattern(c,'repeat')})();
function glyph(p){const x=p.cx,y=p.cy,s=.06,t=p.t;ctx.fillStyle='rgba(0,0,0,.26)';ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=.7*px;
 if(t==1){for(const d of [[-.07,.03],[0,-.03],[.07,.03]]){ctx.beginPath();ctx.moveTo(x+d[0],y+d[1]-s);ctx.lineTo(x+d[0]-s*.7,y+d[1]+s*.5);ctx.lineTo(x+d[0]+s*.7,y+d[1]+s*.5);ctx.fill()}}
 else if(t==3){for(const d of [[-.05,.03,1],[.05,.02,.8]]){ctx.beginPath();ctx.moveTo(x+d[0]-s*d[2],y+d[1]+s*.6);ctx.lineTo(x+d[0],y+d[1]-s*d[2]*1.2);ctx.lineTo(x+d[0]+s*d[2],y+d[1]+s*.6);ctx.closePath();ctx.fill()}}
 else if(t==2){for(const d of [-.05,.05]){ctx.beginPath();ctx.arc(x+d,y+.03,s*.8,Math.PI,0);ctx.stroke()}}
 else if(t==4){for(const d of [-.06,0,.06]){ctx.beginPath();ctx.moveTo(x+d-.02,y+.04);ctx.lineTo(x+d,y-.03);ctx.lineTo(x+d+.02,y+.04);ctx.stroke()}}
 else if(t==5){for(const d of [[-.04,.02],[.02,-.02],[.04,.03]])ctx.fillRect(x+d[0]-.015,y+d[1]-.015,.035,.035)}}
function spaced(txt,size,sp,x,y,ang,al){ctx.save();ctx.translate(x,y);ctx.rotate(ang*Math.PI/180);ctx.font='700 '+size+'px "Trebuchet MS",system-ui,sans-serif';ctx.textBaseline='middle';
 const ch=[...txt],w=ch.map(c=>ctx.measureText(c).width),tot=w.reduce((a,b)=>a+b,0)+sp*(ch.length-1);let x0=-tot/2;ctx.lineJoin='round';ctx.lineWidth=Math.max(2,size*.12);ctx.strokeStyle='rgba(8,10,16,'+(.7*al)+')';ctx.fillStyle='rgba(240,242,246,'+(.74*al)+')';
 ch.forEach((c,i)=>{ctx.strokeText(c,x0,0);ctx.fillText(c,x0,0);x0+=w[i]+sp});ctx.restore()}
function draw(){dirty=false;px=1/Z;
 ctx.setTransform(dpr,0,0,dpr,0,0);const g=ctx.createRadialGradient(CW/2,CH/2,CH*.1,CW/2,CH/2,Math.max(CW,CH)*.75);g.addColorStop(0,'#3c628a');g.addColorStop(1,'#233e5e');ctx.fillStyle=g;ctx.fillRect(0,0,CW,CH);
 ctx.setTransform(dpr*Z,0,0,dpr*Z,dpr*ox,dpr*oy);ctx.lineJoin='round';ctx.lineCap='round';
 const vx0=-ox/Z,vy0=-oy/Z,vx1=(CW-ox)/Z,vy1=(CH-oy)/Z;
 for(const k of [[16,.09],[10,.12],[5,.17]]){ctx.strokeStyle='rgba(150,198,230,'+k[1]+')';ctx.lineWidth=k[0]*px;ctx.stroke(coastP)}
 ctx.fillStyle='#8a8672';ctx.fill(landP,'evenodd');
 const vis=P.filter(p=>p.x1>=vx0&&p.x0<=vx1&&p.y1>=vy0&&p.y0<=vy1);
 for(const p of vis){ctx.fillStyle=p.f[mi];ctx.fill(p.path,'evenodd')}
 ctx.strokeStyle='rgba(15,18,26,'+(.16+.22*Math.min(1,Math.max(0,(Z-10)/30)))+')';ctx.lineWidth=.7*px;for(const p of vis)ctx.stroke(p.path);
 if(Z>=45&&mi<2)for(const p of vis)glyph(p);
 ctx.strokeStyle='rgba(12,14,22,.62)';ctx.lineWidth=1.3*px;ctx.stroke(stP);
 ctx.strokeStyle='rgba(6,7,11,.95)';ctx.lineWidth=2.4*px;ctx.stroke(coP);
 ctx.fillStyle='#3a6489';ctx.fill(lakeP,'evenodd');ctx.strokeStyle='rgba(10,20,40,.55)';ctx.lineWidth=.8*px;ctx.stroke(lakeP);
 if(showRiv&&Z>=10){ctx.strokeStyle='rgba(120,178,222,.92)';ctx.lineWidth=(Z<40?1:1.7)*px;ctx.stroke(rivP)}
 ctx.strokeStyle='rgba(14,26,40,.9)';ctx.lineWidth=1.1*px;ctx.stroke(coastP);
 if(sel>=0){ctx.fillStyle='rgba(255,255,255,.15)';for(const n of nbr[sel])ctx.fill(P[n].path,'evenodd');ctx.fillStyle='rgba(255,255,255,.28)';ctx.fill(P[sel].path,'evenodd');ctx.strokeStyle='#ffd24a';ctx.lineWidth=2.2*px;ctx.stroke(P[sel].path)}
 if(hover>=0&&hover!=sel){ctx.fillStyle='rgba(255,255,255,.2)';ctx.fill(P[hover].path,'evenodd');ctx.strokeStyle='#fff';ctx.lineWidth=1.6*px;ctx.stroke(P[hover].path)}
 ctx.setTransform(dpr,0,0,dpr,0,0);
 if(showLab){
  M.groups.forEach((gr,i)=>{const l=gr.lab;if(!l)return;const s=l[3]*Z;if(s<9)return;spaced(gr.n.toUpperCase(),s,s*.3,wx(l[0])*Z+ox,wy(l[1])*Z+oy,l[2],s>160?Math.max(0,1-(s-160)/160):1)});
  for(const c of M.cities){const z=c[4]?26:c[3]==2?22:c[3]==1?34:60;if(Z<z)continue;const x=wx(c[1])*Z+ox,y=wy(c[2])*Z+oy;if(x<-60||y<-20||x>CW+60||y>CH+20)continue;
   ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=1;if(c[4]){ctx.fillRect(x-3,y-3,6,6);ctx.strokeRect(x-3,y-3,6,6)}else{ctx.beginPath();ctx.arc(x,y,2.5,0,7);ctx.fill();ctx.stroke()}
   ctx.font=(c[4]?'600 12px':'11px')+' system-ui,sans-serif';ctx.textBaseline='middle';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.7)';ctx.strokeText(c[0],x+7,y);ctx.fillStyle='#fff';ctx.fillText(c[0],x+7,y)}}
 ctx.globalAlpha=.07;ctx.fillStyle=noise;ctx.fillRect(0,0,CW,CH);ctx.globalAlpha=1;
 const v=ctx.createRadialGradient(CW/2,CH/2,Math.min(CW,CH)*.35,CW/2,CH/2,Math.max(CW,CH)*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.34)');ctx.fillStyle=v;ctx.fillRect(0,0,CW,CH)}
function pick(sx,sy){const X=(sx-ox)/Z,Y=(sy-oy)/Z;ctx.setTransform(dpr*Z,0,0,dpr*Z,dpr*ox,dpr*oy);
 for(const p of P){if(X<p.x0||X>p.x1||Y<p.y0||Y>p.y1)continue;if(ctx.isPointInPath(p.path,sx*dpr,sy*dpr,'evenodd'))return p.i}return -1}
function zoomAt(sx,sy,f){const z=Math.max(zmin,Math.min(500,Z*f));ox=sx-(sx-ox)/Z*z;oy=sy-(sy-oy)/Z*z;Z=z;dirty=true}
function fit(){zmin=Math.min(CW/WW,CH/HH)*.9;Z=Math.min(CW/WW,CH/HH)*.98;ox=(CW-WW*Z)/2;oy=(CH-HH*Z)/2;dirty=true}
function resize(){dpr=Math.min(2,window.devicePixelRatio||1);CW=innerWidth;CH=Math.max(200,innerHeight-$('bar').offsetHeight);cv.style.width=CW+'px';cv.style.height=CH+'px';cv.width=Math.round(CW*dpr);cv.height=Math.round(CH*dpr);fit()}
function info(){const e=$('info');if(sel<0){e.style.display='none';return}const p=P[sel];e.style.display='block';
 e.innerHTML='<b>Province '+p.i+'</b><br>Owner: '+M.groups[p.g].n+'<br>Terrain: '+TN[p.t]+'<br>State: '+M.states[p.s][1]+' ('+stCount[p.s]+' provinces)<br>Neighbours: '+nbr[p.i].length}
$('stats').textContent=P.length.toLocaleString()+' provinces · '+M.states.length+' states';
$('legend').innerHTML=M.groups.map((g,i)=>P.some(p=>p.g==i)?'<div><i style="background:'+g.c+'"></i>'+g.n+'</div>':'').join('');
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,ox,oy,moved:false};cv.setPointerCapture(e.pointerId);cv.classList.add('drag')});
cv.addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect(),sx=e.clientX-r.left,sy=e.clientY-r.top;
 if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;ox=drag.ox+dx;oy=drag.oy+dy;dirty=true;$('tip').style.display='none';return}
 const h=pick(sx,sy);if(h!=hover){hover=h;dirty=true}const t=$('tip');
 if(h>=0){const p=P[h];t.style.display='block';t.style.left=(e.clientX+14)+'px';t.style.top=(e.clientY+14)+'px';t.textContent=M.states[p.s][1]+' · '+TN[p.t]+' · '+M.groups[p.g].n+' · #'+p.i}else t.style.display='none'});
cv.addEventListener('pointerup',e=>{cv.classList.remove('drag');if(drag&&!drag.moved){const r=cv.getBoundingClientRect();sel=pick(e.clientX-r.left,e.clientY-r.top);info();dirty=true}drag=null});
cv.addEventListener('pointerleave',()=>{$('tip').style.display='none';if(hover>=0){hover=-1;dirty=true}});
cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.2:1/1.2)},{passive:false});
cv.addEventListener('dblclick',e=>{const r=cv.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,2)});
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mi=+b.dataset.m;document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x==b));dirty=true});
$('lab').onclick=()=>{showLab=!showLab;$('lab').classList.toggle('on',showLab);dirty=true};
$('riv').onclick=()=>{showRiv=!showRiv;$('riv').classList.toggle('on',showRiv);dirty=true};
$('zi').onclick=()=>zoomAt(CW/2,CH/2,1.4);$('zo').onclick=()=>zoomAt(CW/2,CH/2,1/1.4);$('zf').onclick=fit;
addEventListener('keydown',e=>{const k=e.key.toLowerCase(),m=60;
 if(k=='arrowleft'||k=='a')ox+=m;else if(k=='arrowright'||k=='d')ox-=m;else if(k=='arrowup'||k=='w')oy+=m;else if(k=='arrowdown'||k=='s')oy-=m;
 else if(k=='+'||k=='=')$('zi').click();else if(k=='-')$('zo').click();else if(k=='l')$('lab').click();else if('1234'.includes(k)&&k)document.querySelector('[data-m="'+(k-1)+'"]').click();else if(k=='escape'){sel=-1;info()}
 dirty=true});
addEventListener('resize',resize);
resize();(function loop(){if(dirty)draw();requestAnimationFrame(loop)})();
})();
</script></body></html>
