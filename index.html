<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eastern Front prototype</title>
<style>
:root{--bg:#0d1014;--panel:#161b22;--ink:#e8eaee;--mut:#8a94a4;--line:#2a313c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,sans-serif}
#bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
button,select{background:#222a35;color:var(--ink);border:1px solid #364050;border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
button:hover{background:#2d3745}button:focus-visible,select:focus-visible{outline:2px solid #8fb4ff;outline-offset:1px}
#go{border-color:#8a3a33}#hud{margin-left:auto;color:var(--mut);font-variant-numeric:tabular-nums}
#wrap{overflow:auto;max-width:100%}canvas{display:block}
#help{padding:8px 12px;color:var(--mut);font-size:13px;max-width:90ch}
</style></head><body>
<div id="bar">
<button id="play">Pause</button><button id="spd">Speed 1×</button><button id="fog">Fog: on</button>
<button id="all">Select all</button><button id="go">Launch Barbarossa</button>
<label>Divisions per side <select id="n"><option>150</option><option>500</option><option>1500</option></select></label>
<button id="rst">Reset</button><span id="hud"></span></div>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="help">You are Germany (grey-blue). Drag to select divisions, right-click to move the selection as a block, or press Launch Barbarossa. The Soviet AI holds the line, reinforces threatened sectors and counter-attacks where it has local superiority. Dim territory is cut off from supply. Space pauses.</div>
<script>
const W=246,H=170,S=4,N=W*H,LON0=6,LAT0=61,DL=.1624,DA=.1;
const cx=l=>(l-LON0)/DL,cy=l=>(LAT0-l)/DA,$=i=>document.getElementById(i);
const cv=$('c'),ctx=cv.getContext('2d');cv.width=W*S;cv.height=H*S;
/* stylised coastlines (lon,lat) */
const SEA=[6,53.3,7,53.5,8.2,53.6,8.9,53.9,8.7,54.4,8.6,55,8.1,55.5,8.1,56.5,8.4,57,9.5,57.5,10.6,57.7,10.5,57,10.3,56.4,9.9,55.5,9.8,54.8,10.2,54.5,10.8,54,12.2,54.2,13.8,54.1,14.3,53.9,15.5,54.2,17,54.7,18.6,54.7,19.8,54.4,20.4,54.7,21,55.2,21.1,55.7,21,56.5,21.5,57.4,22.6,57.75,23.3,57.1,24.1,57,24.4,57.9,24.4,58.4,23.5,58.5,23.5,58.9,24.7,59.4,26.5,59.5,28,59.4,29.5,59.8,30.3,59.9,30,60.1,28.8,60.5,26,60.4,23.5,59.9,22.5,60,21.5,60.8,21.3,61,17.5,61,17.3,60.2,18.8,59.6,18.9,59.3,17.5,58.8,16.5,58.6,16.4,56.7,15.6,56.2,14.2,55.4,13,55.4,12.9,55.6,12.7,56,12.2,57,11.9,57.7,11.2,58.5,10.7,59.2,9,58.4,7,58,6,58.2];
const BLK=[27,44,28.6,44.2,29.7,45.2,30.7,46.5,32.5,46.6,33.7,46.1,32.6,45.4,33.5,44.6,34,44.4,35,44.8,36,45,36.6,45.4,37.5,44.7,38.5,44.3,39,44];
const AZV=[35,45.4,35.8,46.2,36.8,46.6,37.6,47,38.8,47.2,38.7,46.5,37.9,46,37.4,45.4,36.7,45.4];
const oc=document.createElement('canvas');oc.width=W;oc.height=H;const og=oc.getContext('2d',{willReadFrequently:true});og.fillStyle='#fff';
for(const p of [SEA,BLK,AZV]){og.beginPath();for(let i=0;i<p.length;i+=2)i?og.lineTo(cx(p[i]),cy(p[i+1])):og.moveTo(cx(p[i]),cy(p[i+1]));og.fill()}
const wd=og.getImageData(0,0,W,H).data;
const SP=[1,.7,.45,.5],DF=[1,1.25,1.2,1.6],HS=5,HW=Math.ceil(W/HS),HH=Math.ceil(H/HS);
const lnd=new Uint8Array(N),own=new Uint8Array(N),ter=new Uint8Array(N),str=new Float32Array(N),VIS=new Uint8Array(N),Q=new Int32Array(N),SUP=[0,new Uint8Array(N),new Uint8Array(N)];
const head=new Int32Array(HW*HH),NX=new Int32Array(3200);
const CAR=[[17.5,49.2],[19.5,49.4],[21,49.2],[22.8,48.6],[24.5,48],[25.5,47.2],[26,46]].map(p=>[cx(p[0]),cy(p[1])]);
function dseg(px,py,a,b){const dx=b[0]-a[0],dy=b[1]-a[1];let t=((px-a[0])*dx+(py-a[1])*dy)/(dx*dx+dy*dy);t=Math.max(0,Math.min(1,t));return Math.hypot(px-a[0]-t*dx,py-a[1]-t*dy)}
for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x,lon=LON0+x*DL,lat=LAT0-y*DA;if(wd[i*4+3]>127)continue;
 lnd[i]=lon<19.5&&lat>55.3?2:1;let t=0;
 if(Math.hypot((lon-29.2)/2.3,(lat-52.1)/.9)<1)t=2;
 else if(CAR.some((c,k)=>k&&dseg(x,y,CAR[k-1],c)<3))t=3;
 else if(lat>50.5&&Math.sin(x*.13)*Math.cos(y*.11)+Math.sin(x*.05+y*.07)>.55)t=1;ter[i]=t}
const BP=[[44,28.5],[46.5,28.2],[48.3,24.6],[50,24],[52,23.6],[54,23.2],[55,22.6],[56,21],[60.3,21]];
function border(lat){for(let i=1;i<BP.length;i++)if(lat<=BP[i][0]){const a=BP[i-1],b=BP[i];return a[1]+(lat-a[0])/(b[0]-a[0])*(b[1]-a[1])}return 21}
const CITY=[['Berlin',13.4,52.5],['Warsaw',21,52.2],['Kyiv',30.5,50.45],['Minsk',27.6,53.9],['Moscow',37.6,55.75],['Leningrad',30.3,59.9],['Riga',24.1,57],['Kharkiv',36.2,50],['Odessa',30.7,46.5]];
let U=[],T=0,spd=0,run=true,fog=true,R=1.8,drag=null,C=[0,1,1];const SPD=[1,3,8];
function bfs(s){const m=SUP[s];m.fill(0);let h=0,t=0;
 for(let y=0;y<H;y++){const i=y*W+(s==1?0:W-1);if(lnd[i]==1&&own[i]==s){m[i]=1;Q[t++]=i}}
 while(h<t){const i=Q[h++],x=i%W,a=[x>0?i-1:-1,x<W-1?i+1:-1,i>=W?i-W:-1,i<N-W?i+W:-1];
  for(const j of a)if(j>=0&&!m[j]&&lnd[j]==1&&own[j]==s&&str[j]>=25){m[j]=1;Q[t++]=j}}}
function vis(){VIS.fill(0);const r=10;for(const u of U)if(u.s==1&&u.hp>0)for(let y=Math.max(0,u.y-r|0);y<=Math.min(H-1,u.y+r);y++)for(let x=Math.max(0,u.x-r|0);x<=Math.min(W-1,u.x+r);x++)if((x-u.x)**2+(y-u.y)**2<=r*r)VIS[y*W+x]=1}
function count(){C=[0,0,0];for(let i=0;i<N;i++)if(lnd[i]==1)C[own[i]]++}
function reset(){const n=+$('n').value;R=n>=1500?1:n>=500?1.4:1.8;U=[];T=0;
 for(let i=0;i<N;i++){const x=i%W,y=i/W|0,lon=LON0+x*DL,lat=LAT0-y*DA;own[i]=lnd[i]!=1?0:(lat>60.4||lon<border(lat))?1:2;str[i]=100}
 const dep=6+n/28;
 for(let s=1;s<=2;s++)for(let k=0;k<n;k++)for(let t=0;t<30;t++){const lat=47+Math.random()*10,y=cy(lat),b=cx(border(lat)),x=s==1?b-1.5-Math.random()*dep:b+1.5+Math.random()*dep;
  if(lnd[(y|0)*W+(x|0)]==1){U.push({x,y,s,hp:100,tx:-1,ty:-1,sel:0});break}}
 bfs(1);bfs(2);vis();count();tick();ai()}
function local(u){let e=null,ed=1e9,oc=0,ec=0;const hx=u.x/HS|0,hy=u.y/HS|0;
 for(let gy=Math.max(0,hy-2);gy<=Math.min(HH-1,hy+2);gy++)for(let gx=Math.max(0,hx-2);gx<=Math.min(HW-1,hx+2);gx++)for(let j=head[gy*HW+gx];j>=0;j=NX[j]){const v=U[j];if(v.hp<=0)continue;const d=Math.hypot(v.x-u.x,v.y-u.y);if(v.s==u.s)oc++;else{ec++;if(d<ed){ed=d;e=v}}}
 return[e,oc,ec,ed]}
function ai(){const B=28,bh=H/B,fx=new Float32Array(B).fill(-1),th=new Float32Array(B),w=[],cum=[],kc=new Array(B).fill(0);let ws=0,c=0;
 for(let b=0;b<B;b++){let sum=0,n=0;for(let y=Math.floor(b*bh);y<(b+1)*bh;y++)for(let x=1;x<W;x++){const i=y*W+x;if(lnd[i]==1&&own[i]==2&&own[i-1]==1){sum+=x;n++;break}}if(n)fx[b]=sum/n}
 for(const u of U)if(u.s==1&&u.hp>0){const b=Math.min(B-1,u.y/bh|0);if(fx[b]>=0&&Math.abs(u.x-fx[b])<18)th[b]++}
 for(let b=0;b<B;b++){w[b]=fx[b]<0?0:1+th[b]*1.5;ws+=w[b]}
 const S2=U.filter(u=>u.s==2&&u.hp>=25).sort((a,b)=>b.x-a.x);if(!ws||!S2.length)return;
 const nr=Math.floor(S2.length*.18),line=S2.slice(nr).sort((a,b)=>a.y-b.y),res=S2.slice(0,nr);
 for(let b=0;b<B;b++){c+=w[b]/ws*line.length;cum[b]=c}
 line.forEach((u,i)=>{let b=0;while(b<B-1&&(w[b]==0||cum[b]<=i))b++;if(fx[b]<0)return;const k=kc[b]++;u.tx=fx[b]+3+(k%4)*3.2;u.ty=(b+.5)*bh+(((k*37)%10)/10-.5)*bh});
 const rc=new Array(B).fill(0);
 for(const u of res){let bb=-1,bs=-1;for(let b=0;b<B;b++)if(fx[b]>=0&&th[b]/(1+rc[b])>bs){bs=th[b]/(1+rc[b]);bb=b}if(bb<0)continue;rc[bb]++;u.tx=fx[bb]+12;u.ty=(bb+.5)*bh}
 for(const u of S2){const[e,oc,ec,ed]=local(u);if(e&&ed<12&&oc>=1.3*ec){u.tx=e.x;u.ty=e.y}}}
function tick(){T++;if(T%20==0)U=U.filter(u=>u.hp>0);
 head.fill(-1);for(let i=0;i<U.length;i++){const u=U[i];if(u.hp>0){const k=(u.y/HS|0)*HW+(u.x/HS|0);NX[i]=head[k];head[k]=i}}
 for(let a=0;a<U.length;a++){const u=U[a];if(u.hp<=0)continue;
  const ci=(u.y|0)*W+(u.x|0),sup=SUP[u.s][ci]?1:.4,tr=ter[ci],hx=u.x/HS|0,hy=u.y/HS|0;let eng=0,px=0,py=0;
  for(let gy=Math.max(0,hy-1);gy<=Math.min(HH-1,hy+1);gy++)for(let gx=Math.max(0,hx-1);gx<=Math.min(HW-1,hx+1);gx++)for(let j=head[gy*HW+gx];j>=0;j=NX[j]){if(j==a)continue;
   const v=U[j],dx=v.x-u.x,dy=v.y-u.y,d=Math.hypot(dx,dy)||.01;
   if(v.s!=u.s){if(d<2*R+.6){eng=1;v.hp-=.05*(u.hp/100+.2)*sup/DF[ter[(v.y|0)*W+(v.x|0)]]}}
   else if(d<1.8*R){const f=(1.8*R-d)*.25/d;px-=dx*f;py-=dy*f}}
  let tx=u.tx,ty=u.ty,mx=px,my=py;if(u.hp<25){tx=u.s==1?2:W-3;ty=u.y}
  if(tx>=0){const dx=tx-u.x,dy=ty-u.y,d=Math.hypot(dx,dy);if(d>.8){const sp=.06*SP[tr]*(eng?.12:1)*(sup<1?.7:1);mx+=dx/d*sp;my+=dy/d*sp}}
  const nx=u.x+mx,ny=u.y+my;if(nx>1&&nx<W-1&&ny>1&&ny<H-1&&lnd[(ny|0)*W+(nx|0)]==1){u.x=nx;u.y=ny}
  if(sup<1)u.hp-=.01;else if(!eng&&u.hp<100)u.hp+=.02;
  for(let yy=Math.max(0,Math.floor(u.y-R));yy<=Math.min(H-1,Math.ceil(u.y+R));yy++)for(let xx=Math.max(0,Math.floor(u.x-R));xx<=Math.min(W-1,Math.ceil(u.x+R));xx++){
   if((xx-u.x)**2+(yy-u.y)**2>R*R)continue;const i=yy*W+xx;if(lnd[i]!=1)continue;
   if(own[i]==u.s){if(str[i]<100)str[i]+=.25*u.hp/100}
   else{str[i]-=.9*(u.hp/100)*sup/DF[ter[i]];if(str[i]<=0){own[i]=u.s;str[i]=12}}}}
 if(T%10==0)for(let i=0;i<N;i++)if(lnd[i]==1){if(SUP[own[i]][i]){if(str[i]<100)str[i]+=.3}else if(str[i]>5)str[i]-=.2}
 if(T%30==0){bfs(1);bfs(2)}if(T%40==0)ai();if(T%8==0)vis();if(T%60==0)count()}
const img=ctx.createImageData(W,H),o2=document.createElement('canvas');o2.width=W;o2.height=H;const g2=o2.getContext('2d');
const BASE=[[92,104,74],[58,82,60],[70,98,104],[124,118,108]],TINT=[0,[96,118,150],[196,58,50]];
function draw(){const d=img.data;
 for(let i=0;i<N;i++){let r,g,b;const j=i*4,l=lnd[i];
  if(l==0){r=16;g=30;b=50}else if(l==2){r=48;g=50;b=56}
  else{const c=BASE[ter[i]],t=TINT[own[i]],a=.25+.55*str[i]/100;r=c[0]+(t[0]-c[0])*a;g=c[1]+(t[1]-c[1])*a;b=c[2]+(t[2]-c[2])*a;if(!SUP[own[i]][i]){r*=.7;g*=.7;b*=.7}}
  if(fog&&l&&!VIS[i]){r*=.78;g*=.78;b*=.78}
  d[j]=r;d[j+1]=g;d[j+2]=b;d[j+3]=255}
 g2.putImageData(img,0,0);ctx.imageSmoothingEnabled=true;ctx.drawImage(o2,0,0,W*S,H*S);
 ctx.font='11px system-ui';ctx.fillStyle='#fff';
 for(const c of CITY){const x=cx(c[1])*S,y=cy(c[2])*S;ctx.fillRect(x-2,y-2,4,4);ctx.fillText(c[0],x+5,y+4)}
 const show=u=>u.hp>0&&!(u.s==2&&fog&&!VIS[(u.y|0)*W+(u.x|0)]);
 for(const s of [1,2]){ctx.beginPath();for(const u of U)if(u.s==s&&show(u)){ctx.moveTo(u.x*S+R*S,u.y*S);ctx.arc(u.x*S,u.y*S,R*S,0,7)}
  ctx.fillStyle=s==1?'rgba(160,185,220,.22)':'rgba(255,120,100,.22)';ctx.fill();
  ctx.beginPath();for(const u of U)if(u.s==s&&show(u)){ctx.moveTo(u.x*S+1.7,u.y*S);ctx.arc(u.x*S,u.y*S,1.7,0,7)}
  ctx.fillStyle=s==1?'#dfe8f5':'#ffb0a4';ctx.fill()}
 ctx.beginPath();for(const u of U)if(u.sel&&u.hp>0){ctx.moveTo(u.x*S+R*S,u.y*S);ctx.arc(u.x*S,u.y*S,R*S,0,7)}ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.stroke();
 if(drag){ctx.strokeStyle='#8fb4ff';ctx.strokeRect(drag.x*S,drag.y*S,(drag.x2-drag.x)*S,(drag.y2-drag.y)*S)}
 const g=U.filter(u=>u.s==1&&u.hp>0).length,r=U.filter(u=>u.s==2&&u.hp>0).length,tot=C[1]+C[2]||1;
 $('hud').textContent=new Date(Date.UTC(1941,5,22)+Math.floor(T/24)*864e5).toISOString().slice(0,10)+'  |  Germany '+g+' div, '+(100*C[1]/tot).toFixed(0)+'% land  |  USSR '+r+' div, '+(100*C[2]/tot).toFixed(0)+'% land'}
function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width/S,(e.clientY-r.top)*cv.height/r.height/S]}
cv.onmousedown=e=>{if(e.button)return;const p=pos(e);drag={x:p[0],y:p[1],x2:p[0],y2:p[1]}};
cv.onmousemove=e=>{if(drag){const p=pos(e);drag.x2=p[0];drag.y2=p[1]}};
addEventListener('mouseup',()=>{if(!drag)return;const x0=Math.min(drag.x,drag.x2),x1=Math.max(drag.x,drag.x2),y0=Math.min(drag.y,drag.y2),y1=Math.max(drag.y,drag.y2);
 for(const u of U)u.sel=(x1-x0>1&&u.s==1&&u.hp>0&&u.x>=x0&&u.x<=x1&&u.y>=y0&&u.y<=y1)?1:0;drag=null});
cv.oncontextmenu=e=>{e.preventDefault();const p=pos(e),s=U.filter(u=>u.sel&&u.hp>0);if(!s.length)return;
 const mx=s.reduce((a,u)=>a+u.x,0)/s.length,my=s.reduce((a,u)=>a+u.y,0)/s.length;
 for(const u of s){u.tx=Math.max(2,Math.min(W-3,p[0]+u.x-mx));u.ty=Math.max(2,Math.min(H-3,p[1]+u.y-my))}};
$('play').onclick=()=>{run=!run;$('play').textContent=run?'Pause':'Play'};
$('spd').onclick=()=>{spd=(spd+1)%3;$('spd').textContent='Speed '+SPD[spd]+'×'};
$('fog').onclick=()=>{fog=!fog;$('fog').textContent='Fog: '+(fog?'on':'off')};
$('all').onclick=()=>{for(const u of U)u.sel=u.s==1&&u.hp>0?1:0};
$('go').onclick=()=>{for(const u of U)if(u.s==1){const lat=LAT0-u.y*DA,c=lat>56.5?[30.3,59.9]:lat>51.6?[37.6,55.75]:[36.2,50];u.tx=cx(c[0])+((u.x*7)%6-3);u.ty=cy(c[1])+((u.y*5)%6-3)}};
$('rst').onclick=reset;$('n').onchange=reset;
addEventListener('keydown',e=>{if(e.code=='Space'&&e.target.tagName!='SELECT'){e.preventDefault();$('play').click()}});
function loop(){if(run)for(let k=0;k<SPD[spd];k++)tick();draw();requestAnimationFrame(loop)}
reset();loop();
</script></body></html>
