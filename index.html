for(const p of [SEA,BLK,AZV]){og.beginPath();for(let i=0;i<p.length;i+=2)i?og.lineTo(cx(p[i]),cy(p[i+1])):og.moveTo(cx(p[i]),cy(p[i+1]));og.fill()}
const wd=og.getImageData(0,0,W,H).data;
const SP=[1,.7,.45,.5],DF=[1,1.25,1.2,1.6],HS=5,HW=Math.ceil(W/HS),HH=Math.ceil(H/HS);
const lnd=new Uint8Array(N),own=new Uint8Array(N),ter=new Uint8Array(N),str=new Float32Array(N),VIS=new Uint8Array(N),Q=new Int32Array(N),SUP=[0,new Uint8Array(N),new Uint8Array(N)];

function dseg(px,py,a,b){const dx=b[0]-a[0],dy=b[1]-a[1];let t=((px-a[0])*dx+(py-a[1])*dy)/(dx*dx+dy*dy);t=Math.max(0,Math.min(1,t));return Math.hypot(px-a[0]-t*dx,py-a[1]-t*dy)}
for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x,lon=LON0+x*DL,lat=LAT0-y*DA;if(wd[i*4+3]>127)continue;

const CITY=[['Berlin',13.4,52.5],['Warsaw',21,52.2],['Kyiv',30.5,50.45],['Minsk',27.6,53.9],['Moscow',37.6,55.75],['Leningrad',30.3,59.9],['Riga',24.1,57],['Kharkiv',36.2,50],['Odessa',30.7,46.5]];

function bfs(s){const m=SUP[s];m.fill(0);let h=0,t=0;
 for(let y=0;y<H;y++){const i=y*W+(s==1?0:W-1);if(lnd[i]==1&&own[i]==s){m[i]=1;Q[t++]=i}}
 while(h<t){const i=Q[h++],x=i%W,a=[x>0?i-1:-1,x<W-1?i+1:-1,i>=W?i-W:-1,i<N-W?i+W:-1];

function count(){C=[0,0,0];for(let i=0;i<N;i++)if(lnd[i]==1)C[own[i]]++}
function reset(){const n=+$('n').value;R=n>=1500?1.5:n>=500?2.1:2.7;U=[];T=0;
 for(let i=0;i<N;i++){const x=i%W,y=i/W|0,lon=LON0+x*DL,lat=LAT0-y*DA;own[i]=lnd[i]!=1?0:(lat>60.4||lon<border(lat))?1:2;str[i]=100}
 const dep=6+n/28;
 for(let s=1;s<=2;s++)for(let k=0;k<n;k++)for(let t=0;t<30;t++){const lat=47+Math.random()*10,y=cy(lat),b=cx(border(lat)),x=s==1?b-1.5-Math.random()*dep:b+1.5+Math.random()*dep;

function local(u){let e=null,ed=1e9,oc=0,ec=0;const hx=u.x/HS|0,hy=u.y/HS|0;
 for(let gy=Math.max(0,hy-2);gy<=Math.min(HH-1,hy+2);gy++)for(let gx=Math.max(0,hx-2);gx<=Math.min(HW-1,hx+2);gx++)for(let j=head[gy*HW+gx];j>=0;j=NX[j]){const v=U[j];if(v.hp<=0)continue;const d=Math.hypot(v.x-u.x,v.y-u.y);if(v.s==u.s)oc++;else{ec++;if(d<ed){ed=d;e=v}}}

function ai(){const B=28,bh=H/B,fx=new Float32Array(B).fill(-1),th=new Float32Array(B),w=[],cum=[],kc=new Array(B).fill(0);let ws=0,c=0;

 for(const u of U)if(u.s==1&&u.hp>0){const b=Math.min(B-1,u.y/bh|0);if(fx[b]>=0&&Math.abs(u.x-fx[b])<18)th[b]++}
 for(let b=0;b<B;b++){w[b]=fx[b]<0?0:1+th[b]*1.5;ws+=w[b]}

 for(const u of S2){const[e,oc,ec,ed]=local(u);if(e&&ed<12&&oc>=1.3*ec){u.tx=e.x;u.ty=e.y}}}
function tick(){T++;if(T%20==0)U=U.filter(u=>u.hp>0);

   const v=U[j],dx=v.x-u.x,dy=v.y-u.y,d=Math.hypot(dx,dy)||.01;
   if(v.s!=u.s){if(d<2*R+.6){eng=1;v.hp-=.05*(u.hp/100+.2)*sup*u.t.at*u.gb/v.t.df/DF[ter[(v.y|0)*W+(v.x|0)]]}}
   else if(d<1.8*R){const f=(1.8*R-d)*.25/d;px-=dx*f;py-=dy*f}}

  const nx=u.x+mx,ny=u.y+my;if(nx>1&&nx<W-1&&ny>1&&ny<H-1&&lnd[(ny|0)*W+(nx|0)]==1){u.x=nx;u.y=ny}
  u.eng=eng;if(sup<1)u.hp-=.01;else if(!eng&&u.hp<100)u.hp+=.02;
  for(let yy=Math.max(0,Math.floor(u.y-R));yy<=Math.min(H-1,Math.ceil(u.y+R));yy++)for(let xx=Math.max(0,Math.floor(u.x-R));xx<=Math.min(W-1,Math.ceil(u.x+R));xx++){
   if((xx-u.x)**2+(yy-u.y)**2>R*R)continue;const i=yy*W+xx;if(lnd[i]!=1)continue;
   if(own[i]==u.s){if(str[i]<100)str[i]+=.25*u.hp/100}

 if(T%10==0)for(let i=0;i<N;i++)if(lnd[i]==1){if(SUP[own[i]][i]){if(str[i]<100)str[i]+=.3}else if(str[i]>5)str[i]-=.2}

let Z=4,ox=0,oy=0,pan=null,mw=[0,0],drawing=null,flid=1,lastP='';const FL=[];
const TY={inf:{n:'Infantry',at:1,df:1.1,sp:1},mot:{n:'Motorised',at:1.1,df:1,sp:1.5},arm:{n:'Armour',at:1.8,df:.9,sp:1.7},art:{n:'Artillery',at:1.4,df:.6,sp:.8}};
const MIX=[0,[['inf',.62],['mot',.76],['arm',.9],['art',1]],[['inf',.7],['mot',.76],['arm',.88],['art',1]]];
const GR=[0,[{n:'Army Group North',c:'von Leeb',sk:3},{n:'Army Group Centre',c:'von Bock',sk:4},{n:'Army Group South',c:'von Rundstedt',sk:4}],[{n:'Northwestern Front',c:'Kuznetsov',sk:2},{n:'Western Front',c:'Pavlov',sk:2},{n:'Southwestern Front',c:'Kirponos',sk:3}]];
function mk(x,y,s){const r=Math.random(),k=MIX[s].find(m=>r<=m[1])[0],lat=LAT0-y*DA,g=lat>=53.8?0:lat>=50.3?1:2;

function plen(p){let L=0;for(let i=1;i<p.length;i++)L+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);return L}
function at(p,s){for(let i=1;i<p.length;i++){const d=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);if(s<=d||i==p.length-1){const t=Math.min(1,s/(d||1));return[p[i-1][0]+(p[i][0]-p[i-1][0])*t,p[i-1][1]+(p[i][1]-p[i-1][1])*t]}s-=d}return p[0]}
function assign(f,us){f.order=us.slice().sort((a,b)=>a.y-b.y);for(const u of us)u.fl=f.id}
function flines(){for(const f of FL){const us=f.order.filter(u=>u.hp>0&&u.fl==f.id);f.n=us.length;if(!us.length)continue;

 GR[1].forEach((g,i)=>{const n=U.filter(u=>u.s==1&&u.g==i&&u.hp>0).length;h+='<div class="r"><span style="flex:1">'+g.n+'<br>'+g.c+' · skill '+g.sk+' · '+n+' div</span><button data-a="sg" data-i="'+i+'">Select</button></div>'});

const img=ctx.createImageData(W,H),o2=document.createElement('canvas');o2.width=W;o2.height=H;const g2=o2.getContext('2d');

function draw(){const d=img.data;
 for(let i=0;i<N;i++){let r,g,b;const j=i*4,l=lnd[i];
  if(l==0){r=16;g=30;b=50}else if(l==2){r=48;g=50;b=56}
